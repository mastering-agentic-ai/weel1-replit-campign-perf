openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /campaigns.csv:
    get:
      operationId: getCampaignCsv
      tags: [campaigns]
      summary: Download the sample campaign performance dataset
      description: Returns the bundled synthetic daily campaign performance CSV.
      responses:
        "200":
          description: Campaign performance rows in CSV format
          content:
            text/csv:
              schema:
                type: string
        "500":
          description: The sample campaign data could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

